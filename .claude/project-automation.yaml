version: "1.0"
project: "Cloud Drive S3"
automation_type: "development_workflow"

# Development environment automation
development_workflow:
  name: "Android Development Workflow"
  description: "Automated workflow for local development"

  # Pre-commit automation
  pre_commit:
    enabled: true
    hooks:
      - name: "Format Code"
        command: "./gradlew ktfmtFormat"
        stage: "format"
        fix_automatically: true

      - name: "Run Lint"
        command: "./gradlew lint"
        stage: "validation"
        fail_on_error: true

      - name: "Run Unit Tests"
        command: "./gradlew test"
        stage: "testing"
        fail_on_error: true

  # Development build profiles
  build_profiles:
    debug:
      name: "Debug Build"
      gradle_task: "assembleDebug"
      install: true
      signing: false
      proguard: false
      debugging_symbols: true

    release:
      name: "Release Build"
      gradle_task: "assembleRelease"
      install: false
      signing: true
      proguard: true
      debugging_symbols: false

    minimal:
      name: "Minimal Build (Skip Lint)"
      gradle_task: "assembleDebug -x lint"
      install: true
      signing: false
      use_case: "Quick iteration during development"

  # Testing automation
  testing:
    unit_tests:
      command: "./gradlew test"
      coverage_threshold: 70
      report_path: "app/build/reports/tests/"

    instrumented_tests:
      command: "./gradlew connectedAndroidTest"
      requires: "connected_device"
      report_path: "app/build/reports/androidTests/"

    lint_checks:
      command: "./gradlew lint"
      severity_threshold: "error"
      report_path: "app/build/reports/lint-results-debug.html"

    static_analysis:
      command: "./gradlew detekt"
      continue_on_error: true
      report_path: "app/build/reports/detekt/"

  # Quick commands
  quick_commands:
    build: "./gradlew assembleDebug"
    build_minimal: "./gradlew assembleDebug -x lint"
    test: "./gradlew test"
    lint: "./gradlew lint"
    clean: "./gradlew clean"
    install: "./gradlew installDebug"
    run_tests_with_coverage: "./gradlew test jacocoTestReport"

# Pull Request automation
pull_request_workflow:
  name: "Pull Request Workflow"
  description: "Automated checks for pull requests"

  triggers:
    - event: "pr_opened"
      actions:
        - run_build
        - run_tests
        - run_lint
        - code_quality_review

    - event: "pr_updated"
      actions:
        - run_build
        - run_tests
        - run_lint

    - event: "ready_for_review"
      actions:
        - architecture_review
        - documentation_check

  # Automatic labels based on changes
  auto_labels:
    - pattern: "app/src/main/kotlin/data/**"
      labels: ["data-layer"]

    - pattern: "app/src/main/kotlin/service/**"
      labels: ["service-layer"]

    - pattern: "app/src/main/kotlin/ui/**"
      labels: ["ui-layer"]

    - pattern: "app/src/test/**"
      labels: ["tests"]

    - pattern: "README.md|docs/**"
      labels: ["documentation"]

  # Required status checks
  required_checks:
    - "Build and Test / build"
    - "Build and Test / lint"
    - "Build and Test / security-scan"

  # Auto-merge policies
  auto_merge:
    enabled: false
    conditions:
      - all_checks_passed: true
      - approved_by: 1
      - no_requested_changes: true

# Release automation
release_workflow:
  name: "Release Workflow"
  description: "Automated release process"

  version_management:
    strategy: "semantic"
    file: "app/build.gradle.kts"
    pattern: "versionName = \"([0-9.]+)\""
    auto_bump: false  # Require manual version bump

  release_process:
    - step: "verify_all_checks_pass"
      command: "gh workflow run build-and-test.yml --ref main"
      wait_for_completion: true

    - step: "update_changelog"
      command: "# Generate changelog from commits"
      manual: true

    - step: "create_release_branch"
      command: "git checkout -b release/v$VERSION"

    - step: "bump_version"
      command: "# Update version in build.gradle.kts"
      manual: true

    - step: "commit_version"
      command: "git commit -m \"chore: bump version to $VERSION\""

    - step: "build_release"
      command: "./gradlew clean assembleRelease bundleRelease"
      artifact_path: "app/build/outputs/"

    - step: "create_github_release"
      command: "gh release create v$VERSION --notes-file RELEASE_NOTES.md"
      attach_artifacts: true

    - step: "notify_team"
      command: "# Send release notification"

  # Release checklist
  checklist:
    - "All tests passing"
    - "Code review approved"
    - "Version bumped"
    - "Changelog updated"
    - "Release notes prepared"
    - "No breaking changes documented"

# Issue automation
issue_workflow:
  name: "Issue Management"
  description: "Automated issue labeling and routing"

  auto_labeling:
    - keyword: "bug"
      label: "bug"
      priority: "high"

    - keyword: "feature"
      label: "enhancement"

    - keyword: "security"
      label: "security"
      priority: "critical"

    - keyword: "documentation"
      label: "documentation"

  auto_assignment:
    - label: "bug"
      assign_to: "code-owner"  # Requires setup

    - label: "security"
      assign_to: "security-team"

# Notification settings
notifications:
  enabled: true

  channels:
    - type: "console"
      events:
        - build_failed
        - test_failed
        - lint_failed

    - type: "github_check"
      events:
        - build_result
        - test_result
        - lint_result

    - type: "slack"
      enabled: false
      webhook: "${SLACK_WEBHOOK_URL}"
      events:
        - release_created
        - critical_failure

# Tool integrations
integrations:
  gradle:
    version: "8.5"
    java_version: "17"
    gradle_properties:
      - "org.gradle.jvmargs=-Xmx2048m"
      - "kotlin.code.style=official"

  android_studio:
    min_version: "2022.1"
    plugins:
      - "Kotlin"
      - "Detekt"

  github:
    branch_protection: true
    required_approvals: 1
    dismiss_stale_reviews: true

# Performance monitoring
performance:
  track_build_times: true
  track_test_times: true
  alert_on_regression: true
  regression_threshold_percent: 10

# Custom scripts
scripts:
  rebuild_clean: |
    #!/bin/bash
    ./gradlew clean
    rm -rf app/build
    ./gradlew assembleDebug

  run_all_checks: |
    #!/bin/bash
    echo "Running all quality checks..."
    ./gradlew lint
    ./gradlew test
    ./gradlew detekt
    echo "All checks completed!"

  format_code: |
    #!/bin/bash
    ./gradlew ktfmtFormat
    echo "Code formatted!"

  full_release_dry_run: |
    #!/bin/bash
    ./gradlew clean
    ./gradlew lint
    ./gradlew test
    ./gradlew assembleRelease
    ./gradlew bundleRelease
    echo "Release dry-run completed!"
