name: Build and Test

on:
  push:
    branches: [ claude/android-s3-cloud-storage-dBVZG, main, develop ]
  pull_request:
    branches: [ claude/android-s3-cloud-storage-dBVZG, main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: bash .github/scripts/gradle-annotate.sh assembleDebug

      - name: Run unit tests
        run: bash .github/scripts/gradle-annotate.sh test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          files: ./app/build/reports/coverage.xml

      - name: Build release APK
        run: bash .github/scripts/gradle-annotate.sh assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run lint checks
        run: bash .github/scripts/gradle-annotate.sh lint

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Verify frozen Detekt inputs
        run: |
          echo '8c7ead9bf768e5bb00288819bcdfd8d3c0f6c050f2e0cce0a994e5f4e8a3a88f  config/detekt/baseline.xml' | sha256sum --check --strict
          echo '3aee1a2d4cd157abd40db416aa03d6b2f309bc5c4f623e5cd8f64818d8938cfa  config/detekt/detekt.yml' | sha256sum --check --strict

      - name: Run detekt
        run: bash .github/scripts/gradle-annotate.sh detekt

      - name: Upload detekt results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-results
          path: app/build/reports/detekt/
